<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MK Barber</title>
<meta name="description" content="Prise de rendez-vous chez MK Barber, Bordeaux">
<meta name="theme-color" content="#c4202c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MK Barber">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f2f3f0;--surface:#ffffff;--fg:#10192e;--muted:#586179;--line:#d9dce3;
  --accent:#c4202c;--accent-ink:#ffffff;--blue:#1d4f91;--ok:#1b7a4b;--danger:#b3261e;--soft:#e9ebf0;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0c1220;--surface:#151d31;--fg:#eceff6;--muted:#9aa4bd;--line:#27324d;
    --accent:#ff6169;--accent-ink:#1a0709;--blue:#7fb0f0;--ok:#4cc38a;--danger:#ff8a80;--soft:#1d2740;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
.pole{height:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--surface) 12px 24px,var(--blue) 24px 36px,var(--surface) 36px 48px)}
header.profile{padding:22px 0 10px;display:flex;align-items:center;gap:18px}
.avatar{flex:0 0 auto;width:96px;height:96px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:#fff}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.07)}
header.profile .who{min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:.9;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.handle{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.bio{padding:2px 0 4px}
.bio p{margin:0 0 2px;font-size:.98rem}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 22px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 .95rem var(--f-body);padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px}
h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.note{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.svc{display:flex;flex-direction:column;gap:8px}
.svc label{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 14px;cursor:pointer}
.svc input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.svc .n{flex:1;min-width:0;font-weight:600}
.svc .d{font-size:.85rem;color:var(--muted);font-weight:400;display:block}
.svc .p{font-family:var(--f-mono);font-size:.95rem}
.svc label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.day{flex:0 0 62px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 0;text-align:center;cursor:pointer;color:var(--fg);font-family:var(--f-body)}
.day .w{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day .k{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1}
.day .m{display:block;font-size:.72rem;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .m{color:var(--accent-ink)}
.day:disabled{opacity:.4;cursor:not-allowed}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.time{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 0;font:500 .98rem var(--f-mono);color:var(--fg);cursor:pointer}
.time[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 12px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:.82rem;line-height:1.45;resize:vertical}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:block;font:700 1rem var(--f-body);border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:13px 18px;cursor:pointer;width:100%;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:10px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem;margin-bottom:14px}
.err{color:var(--danger);font-size:.92rem;margin:0 0 12px}
.row{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.row .t{font:500 1rem var(--f-mono);min-width:5.5rem}
.row .who{flex:1;min-width:140px}
.row .who b{display:block}
.row .who span{color:var(--muted);font-size:.9rem;display:block}
.badge{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:var(--soft);color:var(--muted);padding:3px 8px;border-radius:99px;font-weight:700}
.badge.warn{background:var(--accent);color:var(--accent-ink)}
.hours{display:grid;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.hrow label.tog{display:flex;gap:10px;align-items:center;font-weight:600;text-transform:capitalize}
.hrow input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.hrow .closed{color:var(--muted);font-size:.9rem;font-weight:400;text-transform:none}
.rng{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.rng input[type=time]{width:112px;padding:8px}
.rng .sep{color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr 100px 86px auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:99px;padding:6px 8px 6px 12px;font-size:.9rem}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:2px 6px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:.9rem;margin-bottom:16px}
ol.steps{padding-left:20px;margin:0 0 14px}
ol.steps li{margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:6px;font-weight:600;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (max-width:480px){
  h1{font-size:2.2rem}
  .avatar{width:80px;height:80px}
  .srow{grid-template-columns:1fr 1fr}
  .srow input[data-f=name]{grid-column:1/3}
}
@media (prefers-reduced-motion:no-preference){
  .time,.day,.btn,.svc label{transition:background .15s,border-color .15s,color .15s}
}
.row .t .sub{color:var(--muted);font-size:.8rem}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.day-h{margin:16px 0 6px;font-weight:700;font-size:.95rem}
.admbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge.st-pending{background:var(--soft);color:var(--fg)}
.badge.st-confirmed{background:var(--ok);color:var(--bg)}
.badge.st-declined,.badge.st-cancelled{background:var(--soft);color:var(--danger)}
.savebar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:24px}
.savebar .btn{width:auto}
.dirty{font-size:.88rem;color:var(--muted)}
.dirty[hidden]{display:none}
</style>
</head>
<body>
<div class="pole" aria-hidden="true"></div>
<div class="wrap">
  <header class="profile">
    <div class="avatar"><img src="logo.png" alt="Logo MK Barber, Bordeaux, depuis 2024" width="96" height="96"></div>
    <div class="who">
      <h1>MK <span>Barber</span></h1>
      <div class="handle">@mk.barber33000</div>
    </div>
  </header>
  <div class="bio">
    <p><b>Prise de rdv en privé</b></p>
    <p>Bordeaux</p>
    <p>Coupe : 10&nbsp;€ (barbe offerte)</p>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
